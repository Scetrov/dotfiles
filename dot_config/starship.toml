"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 500
palette = "tokyo_night"

format = """
[](fg:magenta)\
$username\
[](fg:magenta bg:cyan)\
$hostname\
[](fg:cyan bg:selection)\
$os\
[](fg:selection bg:blue)\
$directory\
[](fg:blue) \
$git_branch\
$git_status\
$status\
$fill\
$shell\
$kubernetes\
$azure\
$rust\
$nodejs\
$dotnet\
$cmd_duration\
$line_break\
$character"""

[fill]
symbol = " "

[palettes.tokyo_night]
background = "#1a1b26"
foreground = "#c0caf5"
black = "#15161e"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#a9b1d6"
orange = "#ff9e64"
teal = "#73daca"
comment = "#565f89"
selection = "#364A82"

[username]
show_always = true
style_user = "bg:magenta fg:background"
style_root = "bg:red fg:black"
format = "[ $user ]($style)"

[hostname]
ssh_only = false
ssh_symbol = " "
style = "bg:cyan fg:background"
format = "[ $ssh_symbol$hostname ]($style)"

[os]
disabled = false
style = "bg:selection fg:foreground"
format = "[ $symbol ]($style)"

[os.symbols]
Arch = ""
Debian = ""
Linux = ""
Macos = ""
NixOS = ""
Ubuntu = ""
Windows = ""

[directory]
style = "bg:blue fg:background"
format = "[   $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
repo_root_style = "bg:blue fg:background bold"
repo_root_format = "[   $before_root_path]($style)[$repo_root]($repo_root_style)[$path ]($style)"

[git_branch]
symbol = " "
style = "bg:yellow fg:background"
format = "[](fg:yellow)[ $symbol$branch]($style)"
truncation_length = 20
truncation_symbol = ".."

[git_status]
style = "bg:yellow fg:background"
format = '([ $all_status$ahead_behind]($style))[ ](bg:yellow)[](fg:yellow) '
conflicted = "=$count"
ahead = "⇡$count"
behind = "⇣$count"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = ""
untracked = "?$count"
stashed = " $count"
modified = "!$count"
staged = "+$count"
renamed = "»$count"
deleted = "✘$count"

[status]
disabled = false
symbol = '[](fg:red)[   ](bg:red fg:black)[](fg:red)'
success_symbol = '[](fg:green)[   ](bg:green fg:background)[](fg:green)'
style = ""
format = '[$symbol]($style)'

[shell]
disabled = false
style = "bg:blue fg:background"
format = '[](fg:blue)[   $indicator ]($style)'

[kubernetes]
disabled = false
style = "bg:selection fg:foreground"
format = '[](fg:selection)[ 󱃾 $context( :: $namespace) ]($style)'

[azure]
disabled = false
style = "bg:teal fg:black"
format = '[](fg:teal)[  $subscription ]($style)'

[rust]
style = "bg:orange fg:black"
format = '[](fg:orange)[  $version ]($style)'

[nodejs]
style = "bg:green fg:black"
format = '[](fg:green)[  $version ]($style)'

[dotnet]
style = "bg:blue fg:black"
format = '[](fg:blue)[  $version ]($style)'

[cmd_duration]
min_time = 0
show_milliseconds = false
style = "bg:magenta fg:background"
format = '[](fg:magenta)[  $duration ]($style)[](fg:magenta)'

[character]
success_symbol = "[ ~](magenta)"
error_symbol = "[ ~](red)"
